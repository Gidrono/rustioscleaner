name: ContextCleaner
options:
  bundleIdPrefix: org.contextcleaner
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  PhotoBridge:
    path: Packages/PhotoBridge
  Analyzers:
    path: Packages/Analyzers
  VLM:
    path: Packages/VLM

targets:
  ContextCleaner:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
    dependencies:
      - package: PhotoBridge
      - package: Analyzers
      - package: VLM
      - framework: Frameworks/CleanerCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.contextcleaner.app
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/ContextCleaner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: YAD78W8647
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: "$(inherited) -lc++"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Generated"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      - name: Ensure Rust XCFramework
        script: |
          FRAMEWORK="${PROJECT_DIR}/Frameworks/CleanerCore.xcframework"
          BUILD_SCRIPT="${PROJECT_DIR}/../scripts/build-xcframework.sh"
          STAMP="${FRAMEWORK}/Info.plist"
          NEEDS_BUILD=0
          if [ ! -d "$FRAMEWORK" ]; then
            NEEDS_BUILD=1
          else
            NEWER=$(find "${PROJECT_DIR}/../core" -type f \( -name '*.rs' -o -name '*.toml' \) -newer "$STAMP" 2>/dev/null | head -1)
            if [ -n "$NEWER" ]; then
              NEEDS_BUILD=1
            fi
          fi
          if [ "$NEEDS_BUILD" = "1" ]; then
            echo "note: rebuilding CleanerCore.xcframework (Rust sources changed)"
            /bin/bash "$BUILD_SCRIPT" || echo "error: run scripts/build-xcframework.sh manually"
          fi
        basedOnDependencyAnalysis: false

  ContextCleanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: ContextCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.contextcleaner.app.tests
        GENERATE_INFOPLIST_FILE: YES
