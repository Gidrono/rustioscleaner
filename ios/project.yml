name: ContextCleaner
options:
  bundleIdPrefix: org.contextcleaner
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

packages:
  PhotoBridge:
    path: Packages/PhotoBridge
  Analyzers:
    path: Packages/Analyzers
  VLM:
    path: Packages/VLM

targets:
  ContextCleaner:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
    dependencies:
      - package: PhotoBridge
      - package: Analyzers
      - package: VLM
      - framework: Frameworks/CleanerCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.contextcleaner.app
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/ContextCleaner.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        OTHER_LDFLAGS: "$(inherited) -lc++"
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
        HEADER_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Generated"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      - name: Ensure Rust XCFramework
        script: |
          if [ ! -d "${PROJECT_DIR}/Frameworks/CleanerCore.xcframework" ]; then
            echo "warning: CleanerCore.xcframework missing — run scripts/build-xcframework.sh"
          fi
        basedOnDependencyAnalysis: false

  ContextCleanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: ContextCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.contextcleaner.app.tests
        GENERATE_INFOPLIST_FILE: YES
