name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: Rust tests
    runs-on: macos-14
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: cli smoke
        run: cargo run -p cleaner-cli -- weights | head -5

  xcframework:
    name: Build XCFramework
    runs-on: macos-14
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Build
        run: ./scripts/build-xcframework.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CleanerCore.xcframework
          path: ios/Frameworks/CleanerCore.xcframework

  ios:
    name: iOS build
    # XcodeGen emits project format 77; needs Xcode 16+ (default on macos-15).
    runs-on: macos-15
    needs: xcframework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CleanerCore.xcframework
          path: ios/Frameworks/CleanerCore.xcframework
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test for simulator
        working-directory: ios
        run: |
          DEST=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          prefer=["iPhone 16","iPhone 17","iPhone SE"]
          devices=[]
          for runtime,devs in data.get("devices",{}).items():
            if "iOS" not in runtime: continue
            for d in devs:
              if d.get("isAvailable") and d.get("name","").startswith("iPhone"):
                devices.append(d["name"])
          for name in prefer:
            if name in devices:
              print(f"platform=iOS Simulator,name={name}")
              raise SystemExit
          if devices:
            print(f"platform=iOS Simulator,name={devices[0]}")
          else:
            raise SystemExit("No iPhone simulator available")
          ')
          echo "Using destination: $DEST"
          xcodebuild \
            -project RustCleaner.xcodeproj \
            -scheme RustCleaner \
            -destination "$DEST" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
